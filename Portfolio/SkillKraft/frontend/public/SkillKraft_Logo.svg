<svg xmlns="http://www.w3.org/2000/svg"
     width="420" height="96" viewBox="0 0 420 96"
     fill="none">
  <title>SkillKraft logo</title>
  <desc>SK logomark followed by SkillKraft wordmark</desc>

  <!-- Transparent background: no background rectangle is included. -->

  <g transform="translate(8 8)">
    <rect x="0" y="0" width="80" height="80" rx="18"
          stroke="#F0A500" stroke-width="5"/>
    <text x="40" y="57"
          text-anchor="middle"
          font-family="'Plus Jakarta Sans', Arial, sans-serif"
          font-size="42"
          font-weight="800"
          letter-spacing="-2"
          fill="#F0A500">SK</text>
  </g>

  <text x="108" y="62"
        font-family="'Plus Jakarta Sans', Arial, sans-serif"
        font-size="40"
        font-weight="600"
        letter-spacing="-1.2"
        fill="#FFFFFF">SkillKraft</text>
</svg>
