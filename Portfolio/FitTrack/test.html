<body style="background: linear-gradient(135deg, #0F0F0F 0%, #1A1A2E 100%); background-attachment: fixed; padding: 40px; min-height: 100vh; display: flex; align-items: center; justify-content: center;">
  
  <div style="width: 520px; background: #1A1A1A; border: 1px solid #2A2A2A; border-radius: 12px; padding: 32px;">
    
    <!-- Step Indicator -->
    <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
      <span style="font-size: 13px; font-weight: 600; color: #808080; text-transform: uppercase; letter-spacing: 0.5px;">Step 1 of 5</span>
      <span style="font-size: 13px; font-weight: 600; color: #FF6B35;">Body Stats</span>
    </div>

    <!-- Progress Bar -->
    <div style="height: 4px; background: #252525; border-radius: 2px; margin-bottom: 24px; overflow: hidden;">
      <div style="height: 100%; width: 20%; background: #FF6B35; border-radius: 2px;"></div>
    </div>

    <!-- Heading -->
    <h2 style="font-size: 24px; font-weight: 600; color: #E8E8E8; margin: 0 0 8px 0;">What are your body stats?</h2>
    <p style="font-size: 14px; color: #A8A8A8; margin: 0 0 24px 0; line-height: 1.6;">This helps us create a personalized plan tailored to your needs.</p>

    <!-- Form Fields -->
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #E8E8E8; margin-bottom: 8px;">Height (cm)</label>
        <input type="number" placeholder="180" style="width: 100%; height: 40px; background: #252525; border: 1px solid #2A2A2A; border-radius: 6px; padding: 0 12px; color: #E8E8E8; font-size: 14px; box-sizing: border-box;" />
      </div>
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #E8E8E8; margin-bottom: 8px;">Weight (kg)</label>
        <input type="number" placeholder="75" style="width: 100%; height: 40px; background: #252525; border: 1px solid #2A2A2A; border-radius: 6px; padding: 0 12px; color: #E8E8E8; font-size: 14px; box-sizing: border-box;" />
      </div>
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #E8E8E8; margin-bottom: 8px;">Age (years)</label>
        <input type="number" placeholder="28" style="width: 100%; height: 40px; background: #252525; border: 1px solid #2A2A2A; border-radius: 6px; padding: 0 12px; color: #E8E8E8; font-size: 14px; box-sizing: border-box;" />
      </div>
      <div>
        <label style="display: block; font-size: 14px; font-weight: 500; color: #E8E8E8; margin-bottom: 8px;">Gender</label>
        <select style="width: 100%; height: 40px; background: #252525; border: 1px solid #2A2A2A; border-radius: 6px; padding: 0 12px; color: #E8E8E8; font-size: 14px; box-sizing: border-box;">
          <option value="">Select...</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>
    </div>

    <!-- Buttons -->
    <div style="display: flex; gap: 12px; margin-top: 32px;">
      <button style="flex: 1; height: 44px; background: transparent; border: 1px solid #2A2A2A; border-radius: 6px; color: #E8E8E8; font-weight: 600; cursor: pointer; font-size: 14px;">Back</button>
      <button style="flex: 1; height: 44px; background: #FF6B35; border: none; border-radius: 6px; color: #1A1A1A; font-weight: 600; cursor: pointer; font-size: 14px;">Next</button>
    </div>
  </div>
</body>
